<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدى — نظام إدارة العيادة</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  منصّة مدى — نموذج واجهة نظام إدارة العيادة الصغيرة (نسخة تجريبية)
  ────────────────────────────────────────────────────────────────────────
  ملف واحد قائم بذاته. الحالة في الذاكرة فقط (تُفقد عند التحديث).

  للمبرمج (عبدالرحمن): نقاط الربط الخلفي موسومة في الكود بـ [ربط خلفي]:
    1) التخزين            → استبدال store.save/load بقاعدة بيانات داخل المملكة.
    2) التفريغ الصوتي     → استبدال المحاكاة بـ Web Speech API أو خدمة STT عربية.
    3) توليد التقرير      → عبر route خلفي يحمل مفتاح Claude (لا مباشرة من المتصفح).
    4) اقتراح التمارين    → نفس المسار الخلفي.
    5) المكتبة المرجعية   → تعبئة REFERENCE_LIBRARY بالروابط والخلاصات المعتمدة.

  نموذج البيانات في كائن state أدناه — هو ما يُخطَّط على قاعدة البيانات.
  ════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --paper:#EDF2F0; --surface:#FFFFFF; --surface-2:#F6F9F8;
  --brand:#1B5E56; --brand-dark:#10322F; --brand-soft:#DCEAE6;
  --gold:#B4893D; --gold-soft:#F4EAD3; --gold-line:#E4CE9E;
  --ink:#12312E; --muted:#5C716D; --line:#D6E0DD; --line-2:#E6ECEA;
  --danger:#B0472E; --danger-soft:#F6E4DE; --ok:#1B6E52; --ok-soft:#DDEEE6;
  --blue:#2A6F97; --blue-soft:#DCEAF2;
  --radius:14px; --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(16,50,47,.05);
  --shadow:0 1px 2px rgba(16,50,47,.04), 0 8px 28px rgba(16,50,47,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Readex Pro",sans-serif;margin:0}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14.5px;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--brand);text-decoration:none}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line-2);margin-bottom:12px}
.brand .mark{width:34px;height:34px;flex:0 0 auto}
.brand .name{font-size:20px;font-weight:700;color:var(--brand-dark)}
.brand .name small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--ink);font-size:14.5px;font-weight:500;text-align:start;width:100%;transition:.13s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.nav-item svg{width:19px;height:19px;flex:0 0 auto;color:var(--muted)}
.nav-item.on svg{color:var(--brand)}
.nav-item .count{margin-inline-start:auto;font-size:11.5px;background:var(--line-2);color:var(--muted);border-radius:100px;padding:1px 8px;font-weight:600}
.nav-item.on .count{background:#fff;color:var(--brand)}
.side-foot{padding:12px 8px 4px;border-top:1px solid var(--line-2);margin-top:8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px}
.side-foot .av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-weight:600;font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 30px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;font-weight:600;color:var(--brand-dark)}
.topbar .sub{font-size:13px;color:var(--muted)}
.topbar .spacer{flex:1}
.chip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:100px;background:var(--gold-soft);color:#8a6420;border:1px solid var(--gold-line)}
.view{padding:26px 30px 60px;max-width:1180px;width:100%}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:var(--radius-sm);border:1.5px solid transparent;font-size:14px;font-weight:600;transition:.14s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:#164e47}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#9d762f}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-soft{background:var(--brand-soft);color:var(--brand-dark)}.btn-soft:hover{background:#cde1db}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger)}.btn-danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* ===== Cards / panels ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px;margin-bottom:16px}
.card>h3{font-size:16px;font-weight:600;color:var(--brand-dark);margin-bottom:4px}
.card>.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.section-head h2{font-size:23px;font-weight:600;color:var(--brand-dark);letter-spacing:-.4px}
.section-head .spacer{flex:1}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--brand);margin-bottom:6px}

/* ===== Fields ===== */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field.last{margin-bottom:0}
label{font-size:13px;font-weight:600;color:var(--ink)}
label .opt{font-weight:400;color:var(--muted);font-size:11.5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);transition:.14s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);background:#fff;outline:none}
textarea{resize:vertical;min-height:84px;line-height:1.7}
textarea.tall{min-height:170px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.seg{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:7px 16px;border-radius:7px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip-btn{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:500;transition:.12s}
.chip-btn:hover{border-color:var(--brand);color:var(--brand)}
.chip-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip-btn.num{min-width:34px;justify-content:center;padding:5px 7px;text-align:center}
.chip-btn.insert{border-style:dashed;font-weight:400}
.chip-btn.insert::before{content:"＋ ";opacity:.6}
.chips-label{font-size:11px;color:var(--muted);margin:10px 0 4px}

/* ===== Toolbar / search ===== */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.search{flex:1;position:relative}
.search input{padding-inline-start:38px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* ===== Table ===== */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.tbl-row{display:grid;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line-2);transition:.12s}
.tbl-row:last-child{border-bottom:none}
.tbl-row.head{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);position:sticky}
.tbl-row.clickable{cursor:pointer}
.tbl-row.clickable:hover{background:var(--surface-2)}
.tbl-row .nm{font-weight:600;color:var(--ink)}
.tbl-row .meta{font-size:12.5px;color:var(--muted)}
.cell-actions{display:flex;gap:6px;justify-content:flex-start}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px}
.badge.green{background:var(--ok-soft);color:var(--ok)}
.badge.gold{background:var(--gold-soft);color:#8a6420}
.badge.grey{background:var(--line-2);color:var(--muted)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ===== Stat cards (dashboard) ===== */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.stat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.stat .ic svg{width:19px;height:19px}
.stat .v{font-size:27px;font-weight:700;color:var(--brand-dark);font-family:"Readex Pro";line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
@media(max-width:1000px){.statgrid{grid-template-columns:repeat(2,1fr)}}

/* ===== Empty ===== */
.empty{padding:38px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{width:38px;height:38px;color:var(--line);margin-bottom:10px}

/* ===== Drawer (slide-in form) ===== */
.scrim{position:fixed;inset:0;background:rgba(16,50,47,.28);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:440px;max-width:92vw;background:var(--paper);z-index:70;transform:translateX(100%);transition:transform .24s ease;overflow:auto;box-shadow:var(--shadow)}
.drawer.show{transform:none}
.drawer-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
.drawer-head h3{font-size:17px;font-weight:600;color:var(--brand-dark)}
.drawer-head .x{margin-inline-start:auto;border:none;background:var(--surface-2);width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:18px}
.drawer-body{padding:20px 22px}

/* ===== Session wizard ===== */
.wiz-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.wiz-step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;color:var(--muted);font-weight:500}
.wiz-step .n{width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600}
.wiz-step.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.wiz-step.on .n{background:var(--brand);color:#fff}
.wiz-step.done .n{background:var(--brand);color:#fff}

.voice{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:14px}
.voice .mic{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:grid;place-items:center;flex:0 0 auto}
.voice .mic svg{width:19px;height:19px}
.voice.rec .mic{background:var(--danger);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,71,46,.35)}50%{box-shadow:0 0 0 9px rgba(176,71,46,0)}}
.voice .vt{flex:1;font-size:12.5px;color:var(--muted)}.voice .vt b{display:block;color:var(--ink);font-size:13px}

.ex-list{display:grid;gap:10px}
.ex{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface)}
.ex.sel{border-color:var(--brand);background:var(--brand-soft)}
.ex-top{display:flex;align-items:flex-start;gap:12px}
.ex-check{width:20px;height:20px;flex:0 0 auto;border:2px solid var(--line);border-radius:6px;margin-top:2px;display:grid;place-items:center;background:#fff}
.ex.sel .ex-check{background:var(--brand);border-color:var(--brand)}
.ex-check svg{width:12px;height:12px;opacity:0;color:#fff}.ex.sel .ex-check svg{opacity:1}
.ex .en{font-size:11.5px;color:var(--muted);direction:ltr;text-align:start}
.ex .ar{font-size:14.5px;font-weight:600}
.ex .desc{font-size:12px;color:var(--muted);margin-top:2px}
.ex .btn-add{align-self:center;margin-inline-start:auto}
.src-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;background:var(--gold-soft);color:#8a6420}
.reflib{background:var(--blue-soft);border:1px solid #bcd8e8;border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px}
.reflib h4{font-size:13px;color:var(--blue);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.reflib ul{margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--ink);line-height:1.7}
.reflib .lnk{font-size:12px;margin-top:6px}

.report-draft{margin-top:16px;border:1.5px solid var(--gold-line);border-radius:var(--radius);overflow:hidden;display:none}
.report-draft.show{display:block}
.report-draft .rh{padding:10px 15px;background:var(--gold-soft);border-bottom:1px solid var(--gold-line);font-size:12.5px;color:#8a6420;font-weight:600}
.report-draft.sealed .rh{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-dark)}
.report-draft textarea{border:none;border-radius:0;min-height:300px;padding:18px 20px;line-height:1.9;font-size:14px;background:#fff}
.report-draft.sealed textarea{background:var(--surface-2)}
.rf{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.seal{display:none;align-items:center;gap:8px;font-size:12.5px;color:var(--brand-dark)}
.report-draft.sealed .seal{display:flex}
.seal .st{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;background:var(--gold-soft)}
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:14px 0}
.spinner{width:15px;height:15px;border:2.5px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.paste-flag{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:7px}
.paste-flag svg{width:13px;height:13px;color:var(--brand)}
.mode-toggle{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:3px;gap:3px;margin-bottom:16px}
.mode-toggle button{border:none;background:transparent;padding:8px 14px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.mode-toggle button.on{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow-sm)}
.pkg{background:var(--brand-dark);color:#cfe3de;border-radius:var(--radius-sm);padding:14px 16px;font-size:12px;line-height:1.8;max-height:200px;overflow:auto;white-space:pre-wrap;margin-bottom:12px}

/* handout */
.handout{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ho-head{padding:22px 26px;border-bottom:2px solid var(--brand);display:flex;justify-content:space-between}
.ho-head .name{font-size:20px;font-weight:700;color:var(--brand-dark);font-family:"Readex Pro"}
.ho-head .meta{text-align:end;font-size:12px;color:var(--muted);line-height:1.7}
.ho-body{padding:22px 26px}
.ho-ex{display:flex;gap:15px;padding:13px 0;border-bottom:1px solid var(--line-2);align-items:center}
.ho-ex:last-child{border-bottom:none}
.ho-ex .n{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto}
.ho-ex .qr{width:62px;height:62px;flex:0 0 auto;padding:3px;border:1px solid var(--line);border-radius:7px}
.ho-ex .qr svg{width:100%;height:100%}
.ho-sched{margin-top:20px;padding:15px;background:var(--surface-2);border-radius:10px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sched .d{text-align:center;padding:8px 3px;border-radius:7px;background:#fff;border:1px solid var(--line);font-size:11.5px}
.sched .d b{display:block;color:var(--brand-dark);margin-bottom:5px}
.sched .d .box{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;margin:0 auto}
.ho-foot{padding:14px 26px;background:var(--surface-2);border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted);text-align:center}

.info-row{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--muted);min-width:120px}
.info-row .v{font-weight:500}

.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);background:var(--brand-dark);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(50%) translateY(-6px)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;z-index:80;transform:translateX(100%);transition:.2s;width:250px}
  .side.show{transform:none}
  .view{padding:20px 16px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none;border:1.5px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center}

@media print{
  .side,.topbar,.no-print{display:none!important}
  .app{display:block}.view{padding:0;max-width:none}
  .handout{border:none}
}
</style>
</head>
<body>

<div class="app">
  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="side" id="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#DCEAE6"/>
        <path d="M7 27 A13 13 0 0 1 33 27" stroke="#1B5E56" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M20 27 L28.5 15.5" stroke="#B4893D" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="20" cy="27" r="2.6" fill="#1B5E56"/>
      </svg>
      <div class="name">مدى <small>نظام إدارة العيادة</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="av">عت</span><div>د. عبدالرحمن التركي<br><span style="font-size:11px">عيادة العلاج الطبيعي</span></div></div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <div class="main">
    <header class="topbar">

/* ══════════════════════════════════════════════════════════════════════

const SESS_STEPS=["التقييم","الخطة والتمارين","التقرير","نشرة المريض"];
let sess=null; // الجلسة الجارية

MODULES.session = (params)=>{
  if(params.patientId && (!sess || sess.patientId!==params.patientId || params.fresh)){
    const p=patientById(params.patientId);
    sess={ patientId:p.id, step:0, dialogue:"", assessment:"",
      dx:"", date:today, sessions:"", frequency:"", home:"", follow:"", pain:"", advice:"", planNotes:"",
      selected:{}, report:"", sealed:false, sealDate:"", addN:0 };
  }
  if(!sess){ // لا مريض محدّد
    $("#view").innerHTML=`<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h6v4H9zM5 6h14v14H5z"/></svg><div>اختر مريضاً من سجل المرضى لبدء جلسة سريرية.</div><button class="btn btn-primary btn-sm" style="margin-top:14px" data-act="go" data-mod="patients">فتح سجل المرضى</button></div></div>`;
    return;
  }
  renderSession();
};
function renderSession(){
  const p=patientById(sess.patientId);
  const steps=SESS_STEPS.map((t,i)=>`<div class="wiz-step ${i===sess.step?'on':i<sess.step?'done':''}" data-act="sessStep" data-i="${i}"><span class="n">${i<sess.step?'✓':toAr(i+1)}</span>${t}</div>`).join("");
  $("#view").innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" data-act="openPatient" data-id="${p.id}">→ ${esc(p.name)}</button>
      <span class="badge grey">${caseLabel(p.caseKey)}</span>
    </div>
    <div class="wiz-steps">${steps}</div>
    <div id="sessBody"></div>
    <div style="display:flex;gap:10px;margin-top:18px">
      ${sess.step>0?`<button class="btn btn-ghost" data-act="sessBack">السابق</button>`:''}
      <div style="flex:1"></div>
      ${sess.step<3?`<button class="btn btn-primary" data-act="sessNext">التالي</button>`:`<button class="btn btn-primary" data-act="sessFinish">إنهاء وحفظ الجلسة</button>`}
    </div>`;
  ({0:sStepAssess,1:sStepPlan,2:sStepReport,3:sStepHandout}[sess.step])();
}

        <div class="vt"><b id="voiceLabel">اضغط لبدء التوثيق الصوتي</b><span id="voiceSub">أو اكتب الحوار في الحقل أدناه</span></div>

  $("#sessBody").innerHTML=`
    <div class="card">
      <h3>رأي الطبيب المعتمد</h3><p class="sub">اختر بنقرة قدر الإمكان. القرار والصياغة النهائية لك.</p>
      <div class="field"><label>التشخيص المعتمد</label><textarea id="fDx" placeholder="…">${esc(sess.dx)}</textarea><div class="chips-label">تشخيصات شائعة:</div><div class="chips">${dxChips}</div></div>
      ${refBox}
      <div class="grid3" style="margin-top:14px">
        <div class="field"><label>تاريخ الجلسة</label><input type="date" id="fDate" value="${sess.date}"></div>

        <div class="field"><label>التكرار</label><div class="chips">${sel(FREQ_OPTS,sess.frequency,'setFreq')}</div></div>
      </div>
      <div class="grid3">
        <div class="field"><label>البرنامج المنزلي</label><div class="chips">${sel(HOME_OPTS,sess.home,'setHome')}</div></div>
        <div class="field"><label>المتابعة</label><div class="chips">${sel(FOLLOW_OPTS,sess.follow,'setFollow')}</div></div>
        <div class="field"><label>شدة الألم <span class="opt">0–10</span></label><div class="chips">${painC}</div></div>
      </div>
      <div class="field last"><label>نصائح وإرشادات للمريض</label><div class="chips-label">نصائح جاهزة:</div><div class="chips">${advChips}</div><textarea id="fAdvice" style="margin-top:8px" placeholder="…">${esc(sess.advice)}</textarea></div>
    </div>
    <div class="card">
      <h3>تمارين الحالة</h3><p class="sub">انقر لإضافة التمرين إلى السلّة.</p>
      <div class="ex-list" id="caseEx"></div>
    </div>
    <div class="card">
      <h3>إضافة تمارين لمشكلات مرتبطة</h3><p class="sub">اكتب اسم تمرين أو هدفاً علاجياً.</p>

      <div class="status-line" id="exStatus" style="display:none"></div>

function renderCaseEx(){

    const id=`case-${key}-${i}`, on=!!sess.selected[id];
    return `<div class="ex ${on?'sel':''}"><div class="ex-top" data-act="toggleCaseEx" data-id="${id}" data-i="${i}" style="cursor:pointer">
      <div class="ex-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div style="flex:1"><div class="en">${ex[1]}</div><div class="ar">${ex[0]}</div><div class="desc">${ex[2]}</div></div></div></div>`;
  }).join("");
}
function renderBasket(){
  const items=Object.entries(sess.selected);
  const bN=$("#basketN"); if(bN) bN.textContent=toAr(items.length);
  const b=$("#basket"); if(!b) return;
  if(!items.length){ b.innerHTML=`<div class="empty" style="padding:20px">لم تُختر تمارين بعد.</div>`; return; }
  b.innerHTML=items.map(([id,ex])=>`<div class="ex sel"><div class="ex-top">

const EX_SYS=`أنت مساعد لأخصائي علاج طبيعي سعودي. يعطيك اسم تمرين أو هدفاً علاجياً. اقترح ٣-٤ تمارين مناسبة. أخرِج مصفوفة JSON فقط بلا نص إضافي، كل عنصر بالحقول: ar، en، desc (بالعربية جملة واحدة).`;
async function exSearch(){
  const q=$("#exQuery").value.trim(); if(!q){toast("اكتب اسم التمرين أو الهدف");return;}
  const st=$("#exStatus"); $("#exSug").innerHTML=""; st.style.display="flex"; st.innerHTML=`<span class="spinner"></span> جارٍ الاقتراح…`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:EX_SYS,messages:[{role:"user",content:q}]})});
    if(!r.ok) throw 0;
    const d=await r.json();
    let t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").replace(/```json|```/g,"").trim();
    const arr=JSON.parse(t); if(!Array.isArray(arr)||!arr.length) throw 0;
    st.style.display="none";
    $("#exSug").innerHTML=arr.map((ex,i)=>`<div class="ex"><div class="ex-top"><div style="flex:1"><div class="en">${esc(ex.en||"")}</div><div class="ar">${esc(ex.ar||"")}</div><div class="desc">${esc(ex.desc||"")}</div></div><button class="btn btn-soft btn-sm btn-add" data-act="addSug" data-i="${i}">أضف</button></div></div>`).join("");
    window._sug=arr;
  }catch(e){
    st.innerHTML=`الاقتراح المباشر يعمل داخل بيئة كلود؛ على الاستضافة الخارجية يلزم ربط خلفي بمفتاح API.`;
  }
}

${sess.advice.trim()||"—"}

const REPORT_SYS=`أنت مساعد صياغة تقارير سريرية لأخصائي علاج طبيعي في السعودية. تتلقّى حزمة (بيانات المريض، الحالة، الحوار، التقييم، رأي الطبيب، النصائح، التمارين). أعد صياغتها في تقرير نهائي احترافي يصدر باسم الطبيب، لا كرأي ذكاء اصطناعي.

الهيكل حرفياً:
التقييم السريري:
التشخيص:
خطة العلاج:
ملاحظات وإرشادات:`;
async function genReport(){
  const st=$("#genStatus"); st.style.display="flex"; st.innerHTML=`<span class="spinner"></span> جارٍ الصياغة عبر كلود…`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:REPORT_SYS,messages:[{role:"user",content:buildPackage()}]})});

    state.sessions.push(rec);
    // إنشاء فاتورة جلسة تلقائياً (غير مدفوعة)
    state.invoices.push({id:uid("i"),patientId:sess.patientId,date:today,items:[{desc:"جلسة علاج طبيعي",amount:300}],total:300,paid:false});
    store.save(); const pid=sess.patientId; sess=null; toast("حُفظت الجلسة وأُنشئت فاتورتها"); go("patients",{id:pid});
  },

  /* session · assess */
  voiceToggle:()=>{
    recording=!recording; const box=$("#voiceBox"); box.classList.toggle("rec",recording);
    if(recording){ $("#voiceLabel").textContent="يسجّل ويفرّغ… (محاكاة)"; $("#voiceSub").textContent="اضغط للإيقاف"; let i=0;
      recTimer=setInterval(()=>{ if(i>=DEMO.length){H.voiceToggle();return;} const ta=$("#fDialogue"); ta.value=(ta.value?ta.value+"\n":"")+DEMO[i]; sess.dialogue=ta.value; ta.scrollTop=ta.scrollHeight; i++; },700);
    } else { clearInterval(recTimer); $("#voiceLabel").textContent="اضغط لبدء التوثيق الصوتي"; $("#voiceSub").textContent="أو اكتب الحوار في الحقل أدناه"; }
  },

  /* session · plan chips */
  insDx:(el)=>{const t=$("#fDx");t.value=(t.value.trim()?t.value.trim()+"\n":"")+el.dataset.t;sess.dx=t.value;},
  insAdv:(el)=>{const t=$("#fAdvice");t.value=(t.value.trim()?t.value.trim()+"\n":"")+el.dataset.t;sess.advice=t.value;},
  setSessN:(el)=>toggleChip(el,'sessions'),
  setFreq:(el)=>toggleChip(el,'frequency'),
  setHome:(el)=>toggleChip(el,'home'),
  setFollow:(el)=>toggleChip(el,'follow'),
  setPain:(el)=>{const v=toAr(el.dataset.v)+" / ١٠"; const on=sess.pain===v; siblingsOff(el); if(on){sess.pain="";el.classList.remove("on");}else{sess.pain=v;el.classList.add("on");}},

  /* session · exercises */
  toggleCaseEx:(el)=>{
    const id=el.dataset.id, key=patientById(sess.patientId).caseKey, i=+el.dataset.i, ex=EX[key][i];
    if(sess.selected[id]) delete sess.selected[id];
    else sess.selected[id]={ar:ex[0],en:ex[1],desc:ex[2],url:`https://mada.app/ex/${key}-${i}`,source:"case"};
    renderCaseEx(); renderBasket();
  },
  exSearch:exSearch,
  addSug:(el)=>{const ex=window._sug[+el.dataset.i]; sess.addN++; sess.selected["add-"+sess.addN]={ar:ex.ar,en:ex.en||"",desc:ex.desc||"",url:`https://mada.app/ex/custom-${sess.addN}`,source:"added"}; el.textContent="أُضيف"; el.disabled=true; renderBasket(); toast("أُضيف للسلّة");},
  rmEx:(el)=>{delete sess.selected[el.dataset.id]; renderCaseEx(); renderBasket();},

  /* session · report */
  genMode:(el)=>{genMode=el.dataset.m;sStepReport();},
  genReport:genReport,
  copyPkg:()=>copy(buildPackage(),"نُسخت الحزمة"),
  loadPaste:()=>{const t=$("#pasteReport").value.trim();if(!t){toast("الصق التقرير أولاً");return;}sess.report=t;sess.sealed=false;sStepReport();},
  copyReport:()=>copy(sess.report,"نُسخ التقرير"),
  sealReport:()=>{if(!sess.report.trim()){toast("لا يوجد تقرير");return;}sess.sealed=true;sess.sealDate=new Date().toLocaleDateString("ar-SA-u-ca-gregory",{year:"numeric",month:"long",day:"numeric"});sStepReport();toast("اعتُمد التقرير");},
  unseal:()=>{sess.sealed=false;sStepReport();},

  /* handout */
  printHandout:()=>window.print(),
};
function toggleChip(el,key){ const v=el.dataset.v, on=sess[key]===v; siblingsOff(el); if(on){sess[key]="";el.classList.remove("on");}else{sess[key]=v;el.classList.add("on");} }
function siblingsOff(el){ Array.from(el.parentElement.children).forEach(x=>x.classList.remove("on")); }

/* live URL edit in basket (input event, delegated) */
document.addEventListener("input",e=>{
  const el=e.target.closest('[data-act="exUrl"]'); if(el){ const id=el.dataset.id; if(sess&&sess.selected[id]){ sess.selected[id].url=el.target?el.target.value:el.value; drawQR(`bq-${id}`,el.value); } }
});
/* click delegation */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act; if(H[act]){ e.preventDefault(); H[act](el); }
});

/* ══════════════════════════════════════════════════════════════════════
   9) الإقلاع
   ══════════════════════════════════════════════════════════════════════ */
store.load();
buildNav();
go("dashboard");
</script>
</body>
</html>
